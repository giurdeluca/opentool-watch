# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io) for every
# release tag (v1.2.3 or 1.2.3), so users can `docker run ghcr.io/<owner>/opentool-watch` without
# building. Can also be started by hand from the Actions tab.
name: Publish Docker image

on:
  push:
    tags: ["v*", "[0-9]*"]  # v1.2.3 or 1.2.3
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: 1.2.3 and 1.2 for a release, plus latest; sha-<commit> for every build.
      # A release candidate (v1.2.3-rc.1) only gets 1.2.3-rc.1: never 1.2 or latest, so it
      # can be tested without changing what users pull.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
