# Template: replace the queries with your topic. See examples/ for a complete use case.
#
# What to search for. Each query is an OpenAlex search string (Boolean, quoted phrases).
# Add, remove or edit queries here; the code does not need to change. Papers found by
# several queries are stored once, with all query names recorded.
queries:
  my_topic: >-
    "your topic phrase"
    AND ("deep learning" OR "machine learning" OR "artificial intelligence")

# First run harvests everything published since this date.
# Later runs only ask for papers published since the previous run (minus a safety overlap).
start_date: "2020-01-01"
overlap_days: 14

# OpenAlex publication types to keep. book-chapter covers Springer LNCS proceedings
# (e.g. MICCAI); drop it if conference papers are not relevant to your field.
types: ["article", "preprint", "book-chapter"]

# Where a link counts as "code or weights available".
code_hosts:
  - github.com
  - gitlab.com
  - bitbucket.org
  - huggingface.co
  - zenodo.org

# When the abstract has no code link, OpenAlex searches its own copy of the full text for
# these words (nothing is downloaded). A hit is flagged "fulltext" in the review queue,
# without the URL. Plain words, not domains: full text is indexed word by word.
fulltext_terms: ["github", "gitlab", "bitbucket", "huggingface", "zenodo"]

# Optional: download open-access PDFs and search them for the exact code link.
# 0 = never download. Set e.g. 400 to turn it back on (the cap is per run).
max_pdf_checks_per_run: 0
max_pdf_mb: 40

# Empty decision columns added to the review queue for the human reviewer.
review_columns: ["include (y/n)", "notes"]
